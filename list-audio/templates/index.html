<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voice Clone App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .circular-progress {
      position: relative;
      width: 100px;
      height: 100px;
    }
    .circular-progress text {
      font-size: 20px;
      fill: #000;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2 class="mb-4">Voice Cloning Service</h2>

    <div id="cloneSuccess" class="alert mt-3 d-none"></div>

    <div id="generateResult" class="mt-3 d-none">
      <div id="generateSuccess" class="alert mt-3 d-none"></div>
    </div>

    <ul class="nav nav-tabs" id="tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#clone" type="button">Clone Voice</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#generate" type="button">Generate Audio</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#list" type="button">List Audio</button>
      </li>
    </ul>

    <div class="tab-content p-4 border border-top-0 bg-white">
      <div class="tab-pane fade show active" id="clone" role="tabpanel">
        <form id="cloneForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Model</label>
            <input type="text" class="form-control" name="model" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Please read this sentence aloud</label>
            <div class="form-control bg-light" readonly>
              <b>The quick brown fox jumps over the lazy dog near the quiet riverbank at sunrise.</b>
            </div>
            <input type="hidden" name="ref_text" value="The quick brown fox jumps over the lazy dog near the quiet riverbank at sunrise." />
          </div>
          <div class="mb-3">
            <div id="recordingStatus" class="text-muted small">Press "Start Recording" to begin</div>
            <button type="button" class="btn btn-secondary mb-2" id="startBtn">🎙️ Start Recording</button>
            <button type="button" class="btn btn-danger mb-2" id="stopBtn" disabled>🛑 Stop Recording</button>
            <audio id="recordedAudio" controls class="d-block my-2 d-none"></audio>

            <div class="circular-progress mt-3">
              <svg width="100" height="100">
                <circle cx="50" cy="50" r="45" stroke="#e6e6e6" stroke-width="8" fill="none" />
                <circle id="progressArc" cx="50" cy="50" r="45" stroke="#0d6efd" stroke-width="8" fill="none"
                  stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" />
                <text id="countdownText" x="50" y="50">9</text>
              </svg>
            </div>
          </div>
          <button class="btn btn-primary">Submit</button>
        </form>

        <div id="cloneSpinner" class="text-center mt-2 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Processing...</span>
          </div>
        </div>
      </div>

      <!-- Generate Audio Tab -->
      <div class="tab-pane fade" id="generate" role="tabpanel">
        <form id="generateForm">
          <div class="mb-3">
            <label class="form-label">Model</label>
            <input type="text" class="form-control" name="model" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Text to Generate</label>
            <textarea class="form-control" name="text" rows="3" required></textarea>
          </div>
          <button class="btn btn-primary">Generate Audio</button>
        </form>
        
        <div id="generateSpinner" class="text-center mt-2 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Processing...</span>
          </div>
        </div>
      </div>

      <!-- List Audio Tab -->
      <div class="tab-pane fade" id="list" role="tabpanel">
        <form id="listForm" class="mb-3">
          <div class="row">
            <div class="col-md-6">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" name="model" required />
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="submit" class="btn btn-primary">List Audio Files</button>
            </div>
          </div>
        </form>
        <div id="audioList" class="list-group">
          <div class="list-group-item text-muted">Select a model and click "List Audio Files"</div>
        </div>
        <div id="listSpinner" class="text-center mt-2 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let recordTimeout = null;
    let progressInterval = null;
    const maxDuration = 9999;
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const audioPlayback = document.getElementById("recordedAudio");
    const statusDiv = document.getElementById("recordingStatus");
    const progressArc = document.getElementById("progressArc");
    const countdownText = document.getElementById("countdownText");
    let recordedBlob = null;

    async function webmToWav(webmBlob) {
      return webmBlob; // Placeholder
    }

    startBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          clearTimeout(recordTimeout);
          clearInterval(progressInterval);
          progressArc.style.strokeDashoffset = 283;
          countdownText.textContent = "9";

          const webmBlob = new Blob(audioChunks, { type: "audio/webm" });
          recordedBlob = await webmToWav(webmBlob);
          const audioUrl = URL.createObjectURL(recordedBlob);
          audioPlayback.src = audioUrl;
          audioPlayback.classList.remove("d-none");
          statusDiv.textContent = "Recording stopped. Ready to submit.";
          stream.getTracks().forEach((track) => track.stop());
        };

        audioChunks = [];
        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusDiv.textContent = "Recording... (max 9 seconds)";

        let elapsed = 0;
        const totalLength = 2 * Math.PI * 45; // 283

        progressInterval = setInterval(() => {
          elapsed += 100;
          const percent = Math.min(elapsed / maxDuration, 1);
          progressArc.style.strokeDashoffset = totalLength * (1 - percent);
          const secondsLeft = Math.floor((maxDuration - elapsed) / 1000);
          countdownText.textContent = secondsLeft;

          if (percent >= 1) {
            clearInterval(progressInterval);
          }
        }, 100);

        recordTimeout = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = "Recording stopped automatically after 9 seconds.";
          }
        }, maxDuration);
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        console.error(err);
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        clearTimeout(recordTimeout);
        clearInterval(progressInterval);
        progressArc.style.strokeDashoffset = 283;
        countdownText.textContent = "9";
      }
    });

    document.getElementById("cloneForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      if (recordedBlob) {
        formData.delete("audio");
        const file = new File([recordedBlob], "recorded.wav", { type: "audio/wav" });
        formData.append("audio", file);
      }

      document.getElementById("cloneSpinner").classList.remove("d-none");
      document.getElementById("cloneSuccess").classList.add("d-none");

      try {
        const res = await fetch("/clone-service", { method: "POST", body: formData });
        const data = await res.json();
        const msg = document.getElementById("cloneSuccess");
        msg.classList.remove("d-none", "alert-success", "alert-danger");
        if (res.ok && data.message) {
          msg.classList.add("alert-success");
          msg.textContent = data.message;
        } else {
          msg.classList.add("alert-danger");
          msg.textContent = data.detail || "An error occurred.";
        }
      } catch {
        const msg = document.getElementById("cloneSuccess");
        msg.classList.remove("d-none", "alert-success");
        msg.classList.add("alert-danger");
        msg.textContent = "Failed to connect or process.";
      } finally {
        document.getElementById("cloneSpinner").classList.add("d-none");
      }
    });

    // Generate Audio handler with correct form data keys
    document.getElementById("generateForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const model = form.model.value.trim();
      const gen_text = form.text.value.trim();

      document.getElementById("generateSpinner").classList.remove("d-none");
      document.getElementById("generateSuccess").classList.add("d-none");
      document.getElementById("generateResult").classList.add("d-none");

      const formData = new FormData();
      formData.append("model", model);
      formData.append("gen_text", gen_text);

      try {
        const res = await fetch("/generate-audio", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();

        if (res.ok && data.message) {
          const msg = document.getElementById("generateSuccess");
          msg.classList.remove("d-none", "alert-danger");
          msg.classList.add("alert-success");
          msg.textContent = "🟢 " + data.message;
          document.getElementById("generateResult").classList.remove("d-none");
        } else {
          const msg = document.getElementById("generateSuccess");
          msg.classList.remove("d-none", "alert-success");
          msg.classList.add("alert-danger");
          msg.textContent = data.detail || "Failed to generate audio";
        }
      } catch (err) {
        const msg = document.getElementById("generateSuccess");
        msg.classList.remove("d-none", "alert-success");
        msg.classList.add("alert-danger");
        msg.textContent = "❌ Failed to connect or process.";
      } finally {
        document.getElementById("generateSpinner").classList.add("d-none");
      }
    });

    document.getElementById("listForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const model = formData.get("model").trim();

      const audioList = document.getElementById("audioList");
      const spinner = document.getElementById("listSpinner");

      audioList.innerHTML = '<div class="list-group-item text-muted">Loading...</div>';
      spinner.classList.remove("d-none");

      try {
        const res = await fetch(`/audio?model=${encodeURIComponent(model)}`);
        const data = await res.json();

        audioList.innerHTML = "";

        if (res.ok && Array.isArray(data) && data.length > 0) {
          data.forEach(({ key, url_txt, url_wav }) => {
            const item = document.createElement("div");
            item.className = "list-group-item d-flex justify-content-between align-items-center";

            let innerHTML = `
                <div>
                  <strong>${key}</strong><br />
                  <small class="text-muted">Model: ${model}</small>
                </div>
                <div class="d-flex align-items-center gap-2">
            `;

            if (url_wav) {
              innerHTML += `
                <audio src="${url_wav}" controls class="ms-3" style="max-width: 250px;"></audio>
              `;
            }else{
               innerHTML += `<span class="badge bg-warning text-dark">Pending</span>`
            }

            innerHTML += `
                  <a href="${url_txt}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">View Text</a>
                </div>
              `;

            item.innerHTML = innerHTML

            audioList.appendChild(item);
          });
        } else {
          audioList.innerHTML = `<div class="list-group-item text-muted">No audio files found for model "<strong>${model}</strong>"</div>`;
        }
      } catch (err) {
        audioList.innerHTML = '<div class="list-group-item text-danger">❌ Error loading audio list</div>';
      } finally {
        spinner.classList.add("d-none");
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
